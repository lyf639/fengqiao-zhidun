services:
  mysql:
    image: mysql:8.4
    container_name: fengqiao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: FengQiao@2026
      MYSQL_DATABASE: fengqiao_zhidun
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pFengQiao@2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fengqiao-app
    ports:
      - "5000:5000"
    command: ["python", "-m", "uvicorn", "backend.server:app", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: FengQiao@2026
      DB_NAME: fengqiao_zhidun
    volumes:
      - ./backend:/app/backend
      - ./web:/app/web

volumes:
  mysql_data:
