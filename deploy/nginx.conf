# 枫桥智盾 · NGINX 反向代理 + 负载均衡
# =========================================
# 适用场景：多 FastAPI 实例 + 读写分离 MySQL 主从集群
#
# 部署方式：
#   cp nginx.conf /etc/nginx/conf.d/fengqiao.conf
#   nginx -t && nginx -s reload

upstream fengqiao_api {
    # 负载均衡策略：least_conn（最小连接数）
    least_conn;

    # 三个 API 实例（多节点高可用）
    server 127.0.0.1:5000 weight=3 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5001 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5002 weight=1 max_fails=3 fail_timeout=30s;

    # 健康检查
    keepalive 32;
}

# 限流区（防 DDoS）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

server {
    listen 80;
    server_name fengqiao.local;

    # 静态资源（直接由 NGINX 托管，减少 Python 压力）
    location /static/ {
        alias /app/web/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://fengqiao_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（AI 调用可能需要较长时间）
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # WebSocket 支持（后续实时推送扩展）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger / ReDoc 文档代理
    location /docs {
        proxy_pass http://fengqiao_api/docs;
    }
    location /redoc {
        proxy_pass http://fengqiao_api/redoc;
    }
}
