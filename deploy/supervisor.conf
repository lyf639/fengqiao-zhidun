# 枫桥智盾 · Supervisor 进程守护
# ==================================
# 自动重启崩溃的服务，保证 7×24 可用
#
# 部署：
#   pip install supervisor
#   cp fengqiao-supervisor.conf /etc/supervisor/conf.d/
#   supervisorctl reread && supervisorctl update

[program:fengqiao-api]
command=python backend/server.py
directory=/app/fengqiao-zhidun
autostart=true
autorestart=true
startretries=5
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/fengqiao/api.log
stderr_logfile=/var/log/fengqiao/api-error.log
environment=PYTHONUNBUFFERED="1"

[program:fengqiao-api-2]
command=python backend/server.py
directory=/app/fengqiao-zhidun
environment=PORT="5001",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/var/log/fengqiao/api-2.log

[program:fengqiao-ai]
command=python backend/ai_server.py
directory=/app/fengqiao-zhidun
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/fengqiao/ai.log
environment=PYTHONUNBUFFERED="1"

[group:fengqiao]
programs=fengqiao-api,fengqiao-api-2,fengqiao-ai
priority=999
