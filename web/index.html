<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枫桥智盾 · 基层矛盾纠纷智能预警与化解平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
</script>
<style>
/* ============================================================
   FENGQIAO ZHIDUN · Government Authoritative Style
   Palette: Deep Blue #0A1F3F · Gold #B8860B · Red #C41E3A
   ============================================================ */
:root {
  --navy-900: #0A1F3F;
  --navy-800: #0F2B54;
  --navy-700: #1B3A6B;
  --navy-600: #2A5290;
  --gold: #B8860B;
  --gold-light: #D4A83A;
  --gold-pale: #FBF4E0;
  --red: #C41E3A;
  --red-pale: #FEF0F2;
  --warm-bg: #F5F3EF;
  --white: #FFFFFF;
  --gray-100: #F0EDE8;
  --gray-200: #E2DDD6;
  --gray-400: #9C968D;
  --gray-600: #5C554A;
  --gray-800: #2D2820;
  --font-display: "Noto Serif SC", "SimSun", "STSong", serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
  --shadow-card: 0 1px 3px rgba(10,31,63,0.06), 0 1px 2px rgba(10,31,63,0.04);
  --shadow-elevated: 0 4px 16px rgba(10,31,63,0.08), 0 2px 4px rgba(10,31,63,0.04);
  --radius: 4px;
  --radius-lg: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--warm-bg);
  color: var(--gray-800);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---------- TOP BAR ---------- */
.topbar {
  background: var(--navy-900);
  color: var(--white);
  padding: 0 48px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(10,31,63,0.25);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.shield {
  width: 38px;
  height: 44px;
  position: relative;
}

.shield svg { width: 100%; height: 100%; }

.topbar-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--white);
}

.topbar-title span { color: var(--gold-light); }

.topbar-subtitle {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 1px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
}

.topbar-badge {
  background: rgba(196,30,58,0.15);
  color: #FAA0A0;
  padding: 4px 14px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border: 1px solid rgba(196,30,58,0.3);
}

/* ---------- TAB NAVIGATION ---------- */
.tab-nav {
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  padding: 0 48px;
  display: flex;
  gap: 0;
  position: sticky;
  top: 64px;
  z-index: 99;
}

.tab-btn {
  padding: 16px 28px;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray-600);
  background: none;
  border: none;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
  letter-spacing: 0.5px;
  font-family: var(--font-body);
}

.tab-btn:hover { color: var(--navy-700); }

.tab-btn.active {
  color: var(--navy-900);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 28px;
  right: 28px;
  height: 3px;
  background: var(--gold);
  border-radius: 3px 3px 0 0;
}

/* ---------- MAIN CONTENT ---------- */
.main-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 48px 80px;
}

.tab-panel { display: none; animation: fadeSlideIn 0.4s ease; }
.tab-panel.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ========== OVERVIEW TAB ========== */

/* Hero */
.hero {
  padding: 72px 0 56px;
  text-align: center;
  border-bottom: 1px solid var(--gray-200);
}

.hero h1 {
  font-family: var(--font-display);
  font-size: 52px;
  font-weight: 900;
  color: var(--navy-900);
  letter-spacing: 6px;
  line-height: 1.2;
}

.hero h1 .gold { color: var(--gold); }

.hero .tagline {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--gray-600);
  margin-top: 16px;
  letter-spacing: 2px;
  font-weight: 400;
}

.hero .positioning {
  margin-top: 24px;
  font-size: 15px;
  color: var(--gray-400);
  max-width: 640px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.8;
}

/* Stat Strip */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--gray-200);
  margin: 48px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.stat-item {
  background: var(--white);
  padding: 32px 28px;
  text-align: center;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 700;
  color: var(--navy-900);
  letter-spacing: -1px;
}

.stat-value.gold { color: var(--gold); }

.stat-label {
  font-size: 13px;
  color: var(--gray-400);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

/* Section Header */
.section-header {
  text-align: center;
  margin: 64px 0 40px;
}

.section-header h2 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  color: var(--navy-900);
  letter-spacing: 3px;
}

.section-header .divider {
  width: 48px;
  height: 3px;
  background: var(--gold);
  margin: 16px auto 0;
  border-radius: 2px;
}

/* Pain-Solution */
.pain-solution {
  display: grid;
  grid-template-columns: 1fr 80px 1fr;
  gap: 0;
  align-items: start;
}

.pain-col, .solution-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.arrow-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  padding-top: 24px;
}

.arrow-item {
  height: 68px;
  display: flex;
  align-items: center;
}

.arrow-item svg { width: 40px; height: 40px; }

.pain-card, .solution-card {
  padding: 20px 24px;
  border-radius: var(--radius-lg);
  transition: var(--transition);
  border: 1px solid transparent;
}

.pain-card {
  background: var(--white);
  border-left: 3px solid var(--gray-400);
}

.pain-card:hover { border-color: var(--gray-400); }

.pain-card .card-label {
  font-size: 11px;
  color: var(--red);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.pain-card .card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--gray-800);
  margin-top: 6px;
}

.pain-card .card-desc {
  font-size: 13px;
  color: var(--gray-400);
  margin-top: 4px;
}

.solution-card {
  background: var(--white);
  border-left: 3px solid var(--gold);
}

.solution-card:hover { border-color: var(--gold); box-shadow: var(--shadow-elevated); }

.solution-card .card-label {
  font-size: 11px;
  color: var(--gold);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.solution-card .card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy-900);
  margin-top: 6px;
}

.solution-card .card-desc {
  font-size: 13px;
  color: var(--gray-600);
  margin-top: 4px;
}

/* Architecture */
.arch-stack {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.arch-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  text-align: center;
  border-top: 3px solid var(--navy-600);
  transition: var(--transition);
}

.arch-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-elevated); }

.arch-card:nth-child(1) { border-top-color: var(--navy-600); }
.arch-card:nth-child(2) { border-top-color: var(--gold); }
.arch-card:nth-child(3) { border-top-color: var(--red); }
.arch-card:nth-child(4) { border-top-color: var(--gray-400); }

.arch-icon { font-size: 32px; margin-bottom: 12px; }
.arch-title { font-size: 15px; font-weight: 700; color: var(--navy-900); letter-spacing: 1px; }
.arch-desc { font-size: 12px; color: var(--gray-400); margin-top: 8px; line-height: 1.6; }

/* ========== COMMON COMPONENTS ========== */

/* Data comparison table */
.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.compare-table thead th {
  background: var(--navy-900);
  color: var(--white);
  padding: 14px 20px;
  text-align: left;
  font-weight: 600;
  letter-spacing: 1px;
  font-size: 13px;
}

.compare-table thead th:first-child { border-radius: var(--radius) 0 0 0; }
.compare-table thead th:last-child { border-radius: 0 var(--radius) 0 0; }

.compare-table tbody td {
  padding: 14px 20px;
  border-bottom: 1px solid var(--gray-200);
  background: var(--white);
}

.compare-table tbody tr:last-child td:first-child { border-radius: 0 0 0 var(--radius); }
.compare-table tbody tr:last-child td:last-child { border-radius: 0 0 var(--radius) 0; }

.compare-table .highlight {
  color: var(--gold);
  font-weight: 700;
  font-family: var(--font-mono);
}

.compare-table .metric-before { color: var(--gray-400); }
.compare-table .metric-after { color: var(--navy-700); font-weight: 600; }

/* Flow steps */
.flow-steps {
  display: flex;
  align-items: flex-start;
  gap: 0;
  margin: 40px 0;
}

.flow-step {
  flex: 1;
  text-align: center;
  position: relative;
  padding: 0 12px;
}

.flow-step::after {
  content: '';
  position: absolute;
  top: 28px;
  right: -8px;
  width: 16px;
  height: 16px;
  border-top: 2px solid var(--gold);
  border-right: 2px solid var(--gold);
  transform: rotate(45deg);
}

.flow-step:last-child::after { display: none; }

.flow-step .step-num {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--navy-900);
  color: var(--white);
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
}

.flow-step:nth-child(1) .step-num { background: var(--navy-900); }
.flow-step:nth-child(2) .step-num { background: var(--navy-700); }
.flow-step:nth-child(3) .step-num { background: var(--navy-600); }
.flow-step:nth-child(4) .step-num { background: var(--gold); }
.flow-step:nth-child(5) .step-num { background: var(--gray-600); }

.flow-step .step-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy-900);
  margin-bottom: 6px;
}

.flow-step .step-desc {
  font-size: 12px;
  color: var(--gray-400);
  line-height: 1.5;
}

/* Alert levels */
.alert-levels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}

.alert-card {
  padding: 28px 24px;
  border-radius: var(--radius-lg);
  text-align: center;
  border: 1px solid transparent;
  transition: var(--transition);
}

.alert-card.red {
  background: var(--red-pale);
  border-color: rgba(196,30,58,0.2);
}

.alert-card.orange {
  background: #FFF8F0;
  border-color: rgba(230,126,34,0.2);
}

.alert-card.yellow {
  background: var(--gold-pale);
  border-color: rgba(184,134,11,0.2);
}

.alert-card .alert-icon { font-size: 36px; margin-bottom: 10px; }
.alert-card .alert-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.alert-card.red .alert-title { color: var(--red); }
.alert-card.orange .alert-title { color: #E67E22; }
.alert-card.yellow .alert-title { color: var(--gold); }
.alert-card .alert-count { font-family: var(--font-mono); font-size: 48px; font-weight: 800; margin: 8px 0; }
.alert-card .alert-desc { font-size: 13px; color: var(--gray-400); line-height: 1.5; }

/* Channel cross diagram */
.channel-cross {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 32px 0;
}

.channel-node {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--white);
  border: 2px solid var(--navy-600);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy-700);
  transition: var(--transition);
  text-align: center;
  line-height: 1.3;
}

.channel-node.center {
  width: 120px;
  height: 120px;
  border-color: var(--gold);
  background: var(--gold-pale);
  font-size: 14px;
  font-weight: 800;
  color: var(--gold-dark, #8B6914);
  box-shadow: 0 0 0 8px rgba(184,134,11,0.08);
}

.channel-node .ch-icon { font-size: 24px; margin-bottom: 4px; }

/* Person card */
.person-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.person-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--gray-200);
  transition: var(--transition);
}

.person-card:hover { box-shadow: var(--shadow-elevated); }

.person-card .pc-header {
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--gray-200);
}

.pc-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: var(--white);
  flex-shrink: 0;
}

.pc-avatar.risk-high { background: var(--red); }
.pc-avatar.risk-mid { background: #E67E22; }
.pc-avatar.risk-low { background: var(--navy-600); }

.pc-info .pc-name { font-size: 16px; font-weight: 700; }
.pc-info .pc-type { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

.pc-body { padding: 20px 24px; }

.pc-timeline { list-style: none; border-left: 2px solid var(--gray-200); padding-left: 16px; }

.pc-timeline li {
  position: relative;
  padding-bottom: 16px;
  font-size: 13px;
  color: var(--gray-600);
}

.pc-timeline li:last-child { padding-bottom: 0; }

.pc-timeline li::before {
  content: '';
  position: absolute;
  left: -21px;
  top: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--navy-600);
}

.pc-timeline li .tl-date {
  font-size: 11px;
  color: var(--gray-400);
  display: block;
}

.pc-footer {
  padding: 14px 24px;
  background: var(--gray-100);
  font-size: 12px;
  color: var(--gray-600);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pc-footer .urgent { color: var(--red); font-weight: 700; }

/* Tag */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.tag-red { background: var(--red-pale); color: var(--red); }
.tag-gold { background: var(--gold-pale); color: var(--gold); }
.tag-blue { background: #E8EEF5; color: var(--navy-700); }

/* ========== DEMO TAB ========== */
.demo-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 0;
}

.demo-step {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  margin-bottom: 20px;
  border: 1px solid var(--gray-200);
  transition: var(--transition);
}

.demo-step.active-step {
  border-color: var(--gold);
  box-shadow: var(--shadow-elevated);
}

.demo-step.completed {
  opacity: 0.7;
  border-color: var(--gray-200);
}

.demo-step-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.demo-step-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

.active-step .demo-step-num { background: var(--gold); color: var(--white); }
.completed .demo-step-num { background: var(--gray-400); color: var(--white); }

.demo-step-title { font-size: 16px; font-weight: 700; color: var(--navy-900); }

.demo-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.demo-form input, .demo-form select {
  padding: 10px 14px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: var(--font-body);
  background: var(--white);
  transition: var(--transition);
}

.demo-form input:focus, .demo-form select:focus {
  outline: none;
  border-color: var(--navy-600);
  box-shadow: 0 0 0 3px rgba(26,58,107,0.08);
}

.demo-form .full-width { grid-column: 1 / -1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  font-family: var(--font-body);
}

.btn-primary { background: var(--navy-900); color: var(--white); }
.btn-primary:hover { background: var(--navy-700); }

.btn-gold { background: var(--gold); color: var(--white); }
.btn-gold:hover { background: var(--gold-light); }

.btn-outline {
  background: transparent;
  border: 1px solid var(--gray-400);
  color: var(--gray-600);
}
.btn-outline:hover { border-color: var(--navy-600); color: var(--navy-700); }

.demo-result {
  background: var(--gold-pale);
  padding: 16px 20px;
  border-radius: var(--radius);
  border: 1px solid rgba(184,134,11,0.2);
  font-size: 14px;
  margin-top: 12px;
  display: none;
}

.demo-result.show { display: block; }

.demo-result.alert-result {
  background: var(--red-pale);
  border-color: rgba(196,30,58,0.2);
}

/* ========== FOOTER ========== */
.footer {
  background: var(--navy-900);
  color: rgba(255,255,255,0.6);
  padding: 40px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-left { font-size: 13px; line-height: 1.8; }
.footer-left strong { color: var(--white); }

.tech-badges {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.tech-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
}

.tech-badge.highlight {
  border-color: var(--gold-light);
  color: var(--gold-light);
  background: rgba(184,134,11,0.1);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 1024px) {
  .stat-strip { grid-template-columns: repeat(2, 1fr); }
  .pain-solution { grid-template-columns: 1fr; }
  .arrow-col { display: none; }
  .arch-stack { grid-template-columns: repeat(2, 1fr); }
  .flow-steps { flex-wrap: wrap; }
  .flow-step { flex: 0 0 33%; margin-bottom: 24px; }
  .flow-step::after { display: none; }
  .person-grid { grid-template-columns: 1fr; }
  .alert-levels { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
  .topbar { padding: 0 20px; }
  .main-content { padding: 0 20px 40px; }
  .hero h1 { font-size: 32px; letter-spacing: 3px; }
  .stat-strip { grid-template-columns: 1fr; }
  .arch-stack { grid-template-columns: 1fr; }
  .tab-nav { padding: 0 12px; overflow-x: auto; }
  .tab-btn { padding: 14px 16px; font-size: 13px; white-space: nowrap; }
  .flow-step { flex: 0 0 50%; }
}
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->

<script>
// ===== TAB SWITCHING =====
const tabBtns = document.querySelectorAll('.tab-btn');
const mainContent = document.getElementById('mainContent');

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTab(btn.dataset.tab);
  });
});

// ===== CHART TRACKER =====
let chartInstances = [];

function destroyCharts() {
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
}

function safeChart(id, config) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) chartInstances.push(new Chart(el, config));
  }, 80);
}

// ===== TAB RENDERER =====
function renderTab(tab) {
  destroyCharts();
  switch(tab) {
    case 'overview': renderOverview(); break;
    case 'dedup': renderDedup(); break;
    case 'alert': renderAlert(); break;
    case 'person': renderPerson(); break;
    case 'demo': renderDemo(); break;
  }
}
