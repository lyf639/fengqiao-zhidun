<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枫桥智盾 · 矛盾纠纷智能预警与化解平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #1a3a6b;
    --primary-light: #2d5aa0;
    --accent: #d4213d;
    --accent-soft: #fff0f0;
    --bg: #f0f3f7;
    --card: #ffffff;
    --text: #222;
    --text-secondary: #666;
    --border: #e2e8f0;
    --warning: #e67e22;
    --success: #27ae60;
    --danger: #c0392b;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 240px; background: var(--primary); color: #fff; display: flex; flex-direction: column;
    flex-shrink: 0; position: sticky; top: 0; height: 100vh; z-index: 10;
  }
  .sidebar-header {
    padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-header .logo-icon {
    width: 36px; height: 36px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold;
  }
  .sidebar-header .title { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .sidebar-header .subtitle { font-size: 11px; opacity: 0.7; font-weight: 400; }
  .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
  .sidebar-nav .section { padding: 8px 20px; font-size: 11px; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; margin-top: 12px; }
  .sidebar-nav .item {
    display: flex; align-items: center; gap: 10px; padding: 11px 20px; margin: 2px 10px;
    border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.15s; color: rgba(255,255,255,0.8);
  }
  .sidebar-nav .item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .sidebar-nav .item.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; }
  .sidebar-nav .item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-nav .item .dot.red { background: var(--accent); }
  .sidebar-nav .item .dot.orange { background: var(--warning); }
  .sidebar-footer {
    padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 12px; opacity: 0.6;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-footer .avatar {
    width: 28px; height: 28px; border-radius: 6px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold;
  }

  /* ===== MAIN ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
  .topbar {
    background: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); gap: 16px;
  }
  .topbar .breadcrumb { font-size: 13px; color: var(--text-secondary); }
  .topbar .breadcrumb span { color: var(--text); font-weight: 600; }
  .topbar .time { font-size: 13px; color: var(--text-secondary); }
  .topbar .badge {
    background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
  }
  .content { padding: 24px 28px; flex: 1; overflow-y: auto; }

  /* ===== STAT CARDS ===== */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 22px; }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .stat-card .info .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-card .info .value { font-size: 32px; font-weight: 700; line-height: 1; }
  .stat-card .info .change { font-size: 12px; margin-top: 6px; }
  .stat-card .info .change.up { color: var(--danger); }
  .stat-card .info .change.down { color: var(--success); }
  .stat-card .icon {
    width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .stat-card .icon.blue { background: #eef4ff; color: var(--primary-light); }
  .stat-card .icon.red { background: #fef0f2; color: var(--accent); }
  .stat-card .icon.orange { background: #fef6ee; color: var(--warning); }
  .stat-card .icon.green { background: #eefaf3; color: var(--success); }

  /* ===== PANELS ===== */
  .panel-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; margin-bottom: 22px; }
  .panel-grid.equal { grid-template-columns: 1fr 1fr; }
  .panel {
    background: var(--card); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow);
  }
  .panel .panel-title {
    font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .panel .panel-title::before { content: ''; width: 3px; height: 16px; background: var(--primary-light); border-radius: 2px; }

  /* ===== TABLE ===== */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: var(--text-secondary); font-weight: 600; border-bottom: 2px solid var(--border); font-size: 12px; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:hover td { background: #f8fafd; }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .tag.red { background: #fef0f2; color: var(--danger); }
  .tag.orange { background: #fef6ee; color: var(--warning); }
  .tag.green { background: #eefaf3; color: var(--success); }
  .tag.blue { background: #eef4ff; color: var(--primary-light); }

  /* ===== ALERT LIST ===== */
  .alert-list { list-style: none; }
  .alert-list li {
    display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start;
  }
  .alert-list li:last-child { border-bottom: none; }
  .alert-list .alert-dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
  }
  .alert-list .alert-dot.red { background: var(--danger); }
  .alert-list .alert-dot.orange { background: var(--warning); }
  .alert-list .alert-content { flex: 1; }
  .alert-list .alert-title { font-size: 13px; font-weight: 600; }
  .alert-list .alert-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .alert-list .alert-time { font-size: 11px; color: #999; white-space: nowrap; }

  /* ===== FEATURE CARDS (for showcase page) ===== */
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feature-card {
    background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
    border-top: 3px solid transparent; transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .feature-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .feature-card.card-blue { border-top-color: var(--primary-light); }
  .feature-card.card-red { border-top-color: var(--accent); }
  .feature-card.card-orange { border-top-color: var(--warning); }
  .feature-card.card-green { border-top-color: var(--success); }
  .feature-card.card-purple { border-top-color: #8e44ad; }
  .feature-card.card-teal { border-top-color: #16a085; }
  .feature-card .fc-icon {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 14px;
  }
  .feature-card .fc-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .feature-card .fc-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1200px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .panel-grid, .panel-grid.equal { grid-template-columns: 1fr; }
    .feature-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar-header .title, .sidebar-header .subtitle, .sidebar-nav .section, .sidebar-nav .item span,
    .sidebar-footer span { display: none; }
    .sidebar-nav .item { justify-content: center; padding: 12px; }
  }
</style>
</head>
<body>
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">盾</div>
      <div>
        <div class="title">枫桥智盾</div>
        <div class="subtitle">矛盾化解 · 智能预警</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="section">核心功能</div>
      <a class="item active" data-page="dashboard">
        <span>📊</span><span>工作总览看板</span>
      </a>
      <a class="item" data-page="cases">
        <span>📋</span><span>矛盾纠纷管理</span>
        <span class="dot orange"></span>
      </a>
      <a class="item" data-page="alerts">
        <span>🔔</span><span>风险预警中心</span>
        <span class="dot red"></span>
      </a>
      <div class="section">重点管理</div>
      <a class="item" data-page="persons">
        <span>👤</span><span>重点人员档案</span>
      </a>
      <a class="item" data-page="policy">
        <span>📜</span><span>政策匹配服务</span>
      </a>
      <div class="section">系统设置</div>
      <a class="item" data-page="datasource">
        <span>🔗</span><span>数据源管理</span>
      </a>
      <a class="item" data-page="reports">
        <span>📄</span><span>研判报告</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">刘</div>
      <span>刘亦凡 · 管理员</span>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">🏠 枫桥智盾 / <span id="pageTitle">工作总览看板</span></div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span class="time" id="clock"></span>
        <span class="badge">🟢 系统运行中 · 本地部署</span>
      </div>
    </header>

    <div class="content" id="pageContent">
      <!-- Dynamic content rendered by JS -->
    </div>
  </div>

<script>
// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' }) + ' ' +
    now.toLocaleTimeString('zh-CN', { hour12: false });
}
updateClock(); setInterval(updateClock, 1000);

// ===== NAVIGATION =====
const pageTitle = document.getElementById('pageTitle');
const pageContent = document.getElementById('pageContent');
const navItems = document.querySelectorAll('.sidebar-nav .item');

navItems.forEach(item => {
  item.addEventListener('click', (e) => {
    e.preventDefault();
    navItems.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const page = item.dataset.page;
    renderPage(page);
  });
});

// ===== CHART INSTANCES TRACKER =====
let chartInstances = [];

function destroyCharts() {
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
}

// ===== RENDER PAGES =====
function renderPage(page) {
  destroyCharts();
  switch(page) {
    case 'dashboard': renderDashboard(); pageTitle.textContent = '工作总览看板'; break;
    case 'cases': renderCases(); pageTitle.textContent = '矛盾纠纷管理'; break;
    case 'alerts': renderAlerts(); pageTitle.textContent = '风险预警中心'; break;
    case 'persons': renderPersons(); pageTitle.textContent = '重点人员档案'; break;
    case 'policy': renderPolicy(); pageTitle.textContent = '政策匹配服务'; break;
    case 'datasource': renderDataSource(); pageTitle.textContent = '数据源管理'; break;
    case 'reports': renderReports(); pageTitle.textContent = '研判报告'; break;
    default: renderDashboard();
  }
}

// ===== DASHBOARD PAGE =====
function renderDashboard() {
  pageContent.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="info">
          <div class="label">本月汇聚事件总数</div>
          <div class="value">1,247</div>
          <div class="change up">↑ 12% 较上月</div>
        </div>
        <div class="icon blue">📥</div>
      </div>
      <div class="stat-card">
        <div class="info">
          <div class="label">智能去重发现重复件</div>
          <div class="value">386</div>
          <div class="change down">去重率 31%</div>
        </div>
        <div class="icon orange">🔄</div>
      </div>
      <div class="stat-card">
        <div class="info">
          <div class="label">已化解 / 处置中</div>
          <div class="value">863</div>
          <div class="change down">化解率 69.2%</div>
        </div>
        <div class="icon green">✅</div>
      </div>
      <div class="stat-card">
        <div class="info">
          <div class="label">实时风险预警</div>
          <div class="value">23</div>
          <div class="change up">⚠ 红色 3 · 橙色 12</div>
        </div>
        <div class="icon red">🔴</div>
      </div>
    </div>

    <div class="panel-grid">
      <div class="panel">
        <div class="panel-title">纠纷类型分布（近30天）</div>
        <canvas id="chartType" height="260"></canvas>
      </div>
      <div class="panel">
        <div class="panel-title">近7日事件趋势</div>
        <canvas id="chartTrend" height="260"></canvas>
      </div>
    </div>

    <div class="panel-grid equal">
      <div class="panel">
        <div class="panel-title">最新矛盾纠纷事件</div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>来源</th><th>事件类型</th><th>当事人</th><th>事发地址</th><th>状态</th><th>时间</th></tr></thead>
            <tbody>
              <tr>
                <td>12345热线</td><td>邻里纠纷</td><td>张**</td><td>菜园镇XX路12号</td>
                <td><span class="tag green">已化解</span></td><td>07-02 10:30</td>
              </tr>
              <tr>
                <td>公安接警</td><td>家庭暴力</td><td>李**</td><td>五龙乡XX村3组</td>
                <td><span class="tag red">处置中</span></td><td>07-02 09:15</td>
              </tr>
              <tr>
                <td>信访平台</td><td>征地拆迁</td><td>王**</td><td>嵊山镇XX大道</td>
                <td><span class="tag orange">研判中</span></td><td>07-01 16:40</td>
              </tr>
              <tr>
                <td>网格员上报</td><td>物业矛盾</td><td>陈**</td><td>洋山镇XX小区</td>
                <td><span class="tag green">已化解</span></td><td>07-01 14:20</td>
              </tr>
              <tr>
                <td>12345热线</td><td>消费维权</td><td>赵**</td><td>菜园镇XX广场</td>
                <td><span class="tag blue">已分流</span></td><td>07-01 11:05</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">实时预警推送</div>
        <ul class="alert-list">
          <li>
            <span class="alert-dot red"></span>
            <div class="alert-content">
              <div class="alert-title">🔴 红色预警：跨4渠道重复事件</div>
              <div class="alert-desc">张**·邻里纠纷·菜园镇（12345+公安+信访+网格员）</div>
            </div>
            <span class="alert-time">2分钟前</span>
          </li>
          <li>
            <span class="alert-dot orange"></span>
            <div class="alert-content">
              <div class="alert-title">🟠 橙色预警：重点人员异常活动</div>
              <div class="alert-desc">李**（精神障碍三级）30天内3次纠纷记录</div>
            </div>
            <span class="alert-time">15分钟前</span>
          </li>
          <li>
            <span class="alert-dot orange"></span>
            <div class="alert-content">
              <div class="alert-title">🟠 橙色预警：跨3渠道关联</div>
              <div class="alert-desc">五龙乡XX村·征地拆迁（12345+信访+网格员）</div>
            </div>
            <span class="alert-time">1小时前</span>
          </li>
          <li>
            <span class="alert-dot orange"></span>
            <div class="alert-content">
              <div class="alert-title">🟡 黄色预警：高频重复上报</div>
              <div class="alert-desc">刘**·物业矛盾·洋山镇·同一人30天4次</div>
            </div>
            <span class="alert-time">2小时前</span>
          </li>
          <li>
            <span class="alert-dot orange"></span>
            <div class="alert-content">
              <div class="alert-title">🟡 黄色预警：随访即将逾期</div>
              <div class="alert-desc">王**·刑满释放人员·下次随访到期（剩余3天）</div>
            </div>
            <span class="alert-time">3小时前</span>
          </li>
        </ul>
      </div>
    </div>
  `;

  setTimeout(() => {
    const c1 = document.getElementById('chartType');
    const c2 = document.getElementById('chartTrend');
    if (!c1 || !c2) return;
    chartInstances.push(new Chart(c1, {
      type: 'doughnut',
      data: {
        labels: ['邻里纠纷','家庭暴力','征地拆迁','物业矛盾','消费维权','劳动争议','其他'],
        datasets: [{
          data: [320, 145, 210, 190, 130, 95, 157],
          backgroundColor: ['#2d5aa0','#d4213d','#e67e22','#27ae60','#8e44ad','#16a085','#7f8c8d'],
          borderWidth: 0,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { padding: 16, usePointStyle: true, pointStyleWidth: 8 } } }
      }
    }));
    chartInstances.push(new Chart(c2, {
      type: 'line',
      data: {
        labels: ['6/26','6/27','6/28','6/29','6/30','7/1','7/2'],
        datasets: [
          { label: '新增事件', data: [42,38,55,47,63,51,44], borderColor: '#2d5aa0', backgroundColor: 'rgba(45,90,160,0.06)', fill: true, tension: 0.3, pointRadius: 4 },
          { label: '已化解', data: [30,32,48,40,55,44,38], borderColor: '#27ae60', backgroundColor: 'rgba(39,174,96,0.06)', fill: true, tension: 0.3, pointRadius: 4 },
          { label: '预警数', data: [2,5,3,4,8,6,3], borderColor: '#e67e22', backgroundColor: 'rgba(230,126,34,0.06)', fill: true, tension: 0.3, pointRadius: 4, borderDash: [6,3] },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyleWidth: 8 } } },
        scales: { y: { beginAtZero: true } }
      }
    }));
  }, 50);
}

// ===== CASES PAGE =====
function renderCases() {
  pageContent.innerHTML = `
    <div class="panel">
      <div class="panel-title" style="margin-bottom:12px;">矛盾纠纷事件列表 <span style="font-weight:400;font-size:12px;color:var(--text-secondary);margin-left:12px;">共 1,247 条记录 · 智能去重已识别 386 条重复</span></div>
      <div style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <input type="text" placeholder="🔍 搜索当事人/地址/关键词..." style="padding:8px 14px;border:1px solid var(--border);border-radius:6px;width:280px;font-size:13px;">
        <select style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
          <option>全部来源</option><option>12345热线</option><option>公安接警</option><option>信访平台</option><option>网格员上报</option>
        </select>
        <select style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
          <option>全部状态</option><option>已化解</option><option>处置中</option><option>研判中</option><option>已分流</option>
        </select>
        <button style="padding:8px 18px;background:var(--primary-light);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">查询</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
